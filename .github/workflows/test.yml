name: FoodXpress Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    name: Security & Standards Tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv
        
    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-interaction
      
    - name: Run PHP CodeSniffer
      run: vendor/bin/phpcs --standard=WordPress includes/
      
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse includes/ --level=5
      
    - name: Security vulnerability scan
      run: composer audit

  unit-tests:
    runs-on: ubuntu-latest
    name: PHPUnit Tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv
        coverage: xdebug
        
    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction
      
    - name: Run PHPUnit tests
      run: cd tests && php ../vendor/bin/phpunit --configuration phpunit.xml --coverage-clover coverage.xml
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: tests/coverage.xml

  e2e-tests:
    runs-on: ubuntu-latest
    name: End-to-End Tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Playwright
      run: |
        cd tests/e2e
        npm init -y
        npm install @playwright/test
        npx playwright install --with-deps
        
    - name: Start test environment
      run: |
        cd tests/docker
        docker-compose up -d
        sleep 30
        
    - name: Run Playwright tests
      run: |
        cd tests/e2e
        npx playwright test
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
